name: Notebook checks
on:
  push:
    paths: ['notebook-app/**', '.github/workflows/notebook-check.yml']
  pull_request:
    paths: ['notebook-app/**', '.github/workflows/notebook-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notebook-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: notebook-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:model
      - run: npm run build
      - run: npx -y firebase-tools@15.36.0 emulators:exec --only firestore --project demo-school-notebook 'node tests/rules.test.mjs'
