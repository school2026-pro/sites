name: Planner checks
on:
  push:
    paths: ['planner/**', '.github/workflows/planner-check.yml']
  pull_request:
    paths: ['planner/**', '.github/workflows/planner-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: planner/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run db:local
      - run: npm run db:local
